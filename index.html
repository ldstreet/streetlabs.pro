<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Labs</title>
<meta name="description" content="Street Labs — software by Luke Street.">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0a0a0f;
    background-image:
      radial-gradient(ellipse 60% 50% at 50% -10%, rgba(99,102,241,.18), transparent),
      radial-gradient(ellipse 40% 40% at 80% 110%, rgba(14,165,233,.12), transparent);
    color: #e7e7ef;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .dot { color: #818cf8; }
  p.tagline {
    margin-top: 0.75rem;
    font-size: 1.05rem;
    color: #9a9ab0;
  }
  a.contact {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.7rem 1.6rem;
    border: 1px solid rgba(129,140,248,.4);
    border-radius: 999px;
    color: #c7d2fe;
    text-decoration: none;
    transition: background .2s, border-color .2s;
  }
  a.contact:hover { background: rgba(129,140,248,.12); border-color: #818cf8; }
  footer { margin-top: 3rem; font-size: .8rem; color: #55556a; }
</style>
</head>
<body>
  <main>
    <h1>Street Labs<span class="dot">.</span></h1>
    <p class="tagline">Software by Luke Street.</p>
    <a class="contact" href="mailto:github@streetlabs.pro">Get in touch</a>
  </main>
  <footer>&copy; 2026 Street Labs</footer>
</body>
</html>
